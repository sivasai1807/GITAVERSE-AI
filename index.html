
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitaVerse AI - Divine Knowledge Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Sanskrit+Text&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', serif;
            background-color: #fffcf9; 
            overflow: hidden; /* Ensure no body scrollbar */
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .sanskrit { font-family: 'Sanskrit Text', serif; }
        
        /* Absolute Scrollbar Removal */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
        }
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        /* Divine Aura Animation */
        @keyframes aura-glow {
            0% { box-shadow: 0 0 20px rgba(244, 196, 48, 0.2); }
            50% { box-shadow: 0 0 40px rgba(244, 196, 48, 0.5); }
            100% { box-shadow: 0 0 20px rgba(244, 196, 48, 0.2); }
        }
        .divine-aura {
            animation: aura-glow 3s ease-in-out infinite;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
